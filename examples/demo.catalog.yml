catalog: SeamScript synthetic demonstration
version: 1

defaults:
  model: approved demo event
  comparison: matched comparison
  simulation: adaptive simulation

data:
  synthetic demo pitches:
    connector: csv
    connection: project files
    object: ../data/sample-pitches.csv
    contract: seam.pitch.v1
    access: read only

models:
  approved demo event:
    registry:
      connector: static
      name: transparent-demo-outcome
      version: 1.0.0
    serving:
      connector: builtin logistic
      name: transparent-demo-outcome
    input: seam.pitch.features.v1
    output: seam.pitch.outcomes.v1
    training_cutoff: 2022-12-31
    require:
      status: approved
      calibration: passed

algorithms:
  matched comparison:
    connector: builtin
    operation: exact-strata-weighting
    release: 1.0.0
    input: seam.comparison.request.v1
    output: seam.comparison.result.v1

  adaptive simulation:
    connector: builtin
    operation: adaptive-bernoulli
    release: 1.0.0
    input: seam.simulation.request.v1
    output: seam.simulation.result.v1

policy:
  minimum_group_size: 5
  initial_trials: 10000
  maximum_trials: 100000
  maximum_half_width: 0.005
